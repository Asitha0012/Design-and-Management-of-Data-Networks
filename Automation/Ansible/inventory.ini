# EE8203 Campus Switch Network Inventory Definitions
# Defines target distribution and access layer switches along with group hierarchy.

[distribution]
# Distribution layer switches responsible for inter-VLAN aggregation
SW-D-DEIE ansible_host=10.99.99.11
SW-D-DCEE ansible_host=10.99.99.12
SW-D-DMME ansible_host=10.99.99.13

[access]
# Access layer switches connecting end-user VPCs and infrastructure VMs
SW-A-DEIE ansible_host=10.99.99.21
SW-A-DCEE ansible_host=10.99.99.22
SW-A-DMME ansible_host=10.99.99.23
SW-A-DIS ansible_host=10.99.99.24

[switches:children]
# Meta-group aggregating distribution and access switches for site-wide playbooks
distribution
access
