# Global Network Connection & Common Infrastructure Settings
# Applies to all network devices defined in inventory.ini

# Connection plugin and network platform definition for Cisco IOS devices
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios

# Device access credentials and privilege escalation settings
ansible_user: admin
ansible_password: adminpass
ansible_become: true
ansible_become_method: enable
ansible_become_password: adminpass

# Global Spanning-Tree Mode and Native VLAN ID definition
native_vlan: 100
stp_mode: rapid-pvst

# Base VLANs deployed globally across all network switches
common_vlans:
  - vlan_id: 99
    name: MGMT
  - vlan_id: 100
    name: NATIVE
