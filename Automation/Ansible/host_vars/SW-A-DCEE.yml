# Host-Specific Variables: SW-A-DCEE (Access Switch - DCEE Department)

# VLAN required on this access switch
device_vlans:
  - { vlan_id: 20, name: VLAN_DCEE }

# Trunk uplink interface connecting to Distribution Switch
trunk_interfaces:
  - name: GigabitEthernet0/0
    description: "Trunk -> SW-D-DCEE"
    allowed_vlans: [20, 99, 100]

# Access interfaces assigned to DCEE department VLAN (VLAN 20)
access_interfaces:
  - name: GigabitEthernet1/0
    description: "VPC-DCEE-01"
    vlan: 20
  - name: GigabitEthernet1/1
    description: "VPC-DCEE-02"
    vlan: 20
